<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F-Stop Timer Demo</title>
<style>
  :root {
    --bg: #1a1a1a;
    --panel: #242424;
    --border: #333;
    --led-off: #1a0000;
    --led-on: #ff3300;
    --enlarger-off: #0a0a1a;
    --enlarger-on: #ffcc00;
    --seg-off: #1a1a0a;
    --seg-on: #ffdd00;
    --btn: #2e2e2e;
    --btn-hover: #3e3e3e;
    --btn-active: #555;
    --text: #ccc;
    --label: #888;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px;
    gap: 24px;
    min-height: 100vh;
  }
  h1 { font-size: 1.1rem; letter-spacing: .15em; color: var(--label); }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    width: 100%;
    max-width: 560px;
  }
  .panel-title {
    font-size: .65rem;
    letter-spacing: .12em;
    color: var(--label);
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  /* 7-segment display */
  #display {
    font-family: 'Courier New', monospace;
    font-size: 4rem;
    font-weight: bold;
    color: var(--seg-on);
    background: #111;
    border-radius: 6px;
    padding: 12px 24px;
    text-align: center;
    letter-spacing: .1em;
    text-shadow: 0 0 12px rgba(255,220,0,.6);
    min-width: 180px;
    display: inline-block;
  }
  .display-row {
    display: flex;
    align-items: center;
    gap: 20px;
  }
  #enlarger-indicator {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--enlarger-off);
    border: 2px solid #333;
    transition: background .1s, box-shadow .1s;
  }
  #enlarger-indicator.on {
    background: var(--enlarger-on);
    box-shadow: 0 0 16px rgba(255,200,0,.7);
  }

  /* LED rows */
  .led-row {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  .led-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .led {
    width: 18px; height: 18px;
    border-radius: 50%;
    background: var(--led-off);
    border: 1px solid #333;
    transition: background .05s, box-shadow .05s;
  }
  .led.on {
    background: var(--led-on);
    box-shadow: 0 0 8px rgba(255,51,0,.8);
  }
  .led-label {
    font-size: .6rem;
    color: var(--label);
    text-align: center;
  }

  /* Mode selector */
  .mode-selector {
    display: flex;
    gap: 8px;
  }
  .mode-btn {
    flex: 1;
    padding: 10px;
    border: 1px solid var(--border);
    background: var(--btn);
    color: var(--text);
    border-radius: 4px;
    cursor: pointer;
    font-family: monospace;
    font-size: .8rem;
    letter-spacing: .05em;
    transition: background .1s;
  }
  .mode-btn:hover { background: var(--btn-hover); }
  .mode-btn.active {
    background: #3a3000;
    border-color: var(--seg-on);
    color: var(--seg-on);
  }

  /* Action buttons */
  .btn-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .action-btn {
    padding: 12px 8px;
    border: 1px solid var(--border);
    background: var(--btn);
    color: var(--text);
    border-radius: 4px;
    cursor: pointer;
    font-family: monospace;
    font-size: .75rem;
    letter-spacing: .05em;
    transition: background .1s;
    user-select: none;
  }
  .action-btn:hover { background: var(--btn-hover); }
  .action-btn:active { background: var(--btn-active); }
  .action-btn.start {
    background: #1a2800;
    border-color: #4a7a00;
    color: #88cc00;
  }
  .action-btn.start:hover { background: #223300; }
  .action-btn.start:active { background: #2a4000; }

  /* Dial controls */
  .dials {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .dial {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    flex: 1;
    min-width: 100px;
  }
  .dial-label { font-size: .65rem; color: var(--label); letter-spacing: .08em; }
  .dial-btns { display: flex; gap: 6px; }
  .dial-btn {
    width: 36px; height: 36px;
    border: 1px solid var(--border);
    background: var(--btn);
    color: var(--text);
    border-radius: 4px;
    cursor: pointer;
    font-size: 1.1rem;
    display: flex; align-items: center; justify-content: center;
    transition: background .1s;
    user-select: none;
  }
  .dial-btn:hover { background: var(--btn-hover); }
  .dial-btn:active { background: var(--btn-active); }

  #status-bar {
    font-size: .7rem;
    color: var(--label);
    height: 1.2em;
  }
</style>
</head>
<body>
<h1>F-STOP TIMER</h1>

<div class="panel">
  <div class="panel-title">Display</div>
  <div class="display-row">
    <div id="display">--.-</div>
    <div>
      <div class="led-label" style="margin-bottom:4px">ENLARGER</div>
      <div id="enlarger-indicator"></div>
    </div>
  </div>
</div>

<div class="panel">
  <div class="panel-title">Step Interval LEDs &nbsp; (1/8 &nbsp; 1/4 &nbsp; 1/3 &nbsp; 1/2)</div>
  <div class="led-row" id="step-leds">
    <div class="led" id="si-0"></div>
    <div class="led" id="si-1"></div>
    <div class="led" id="si-2"></div>
    <div class="led" id="si-3"></div>
  </div>
</div>

<div class="panel">
  <div class="panel-title">Print Stop LEDs &nbsp; (-3 &nbsp; -2 &nbsp; -1 &nbsp; 0 &nbsp; +1 &nbsp; +2 &nbsp; +3)</div>
  <div class="led-row" id="stop-leds">
    <div class="led" id="ps-0"></div>
    <div class="led" id="ps-1"></div>
    <div class="led" id="ps-2"></div>
    <div class="led" id="ps-3"></div>
    <div class="led" id="ps-4"></div>
    <div class="led" id="ps-5"></div>
    <div class="led" id="ps-6"></div>
  </div>
</div>

<div class="panel">
  <div class="panel-title">Mode</div>
  <div class="mode-selector">
    <button class="mode-btn" id="mode-focus" onclick="selectMode(0)">FOCUS</button>
    <button class="mode-btn" id="mode-test"  onclick="selectMode(1)">TEST</button>
    <button class="mode-btn active" id="mode-print" onclick="selectMode(2)">PRINT</button>
  </div>
</div>

<div class="panel">
  <div class="panel-title">Dials</div>
  <div class="dials">
    <div class="dial">
      <div class="dial-label">BASE TIME</div>
      <div class="dial-btns">
        <div class="dial-btn" onclick="dial(0,-1)">&#8722;</div>
        <div class="dial-btn" onclick="dial(0,+1)">&#43;</div>
      </div>
    </div>
    <div class="dial">
      <div class="dial-label">STEP INTERVAL</div>
      <div class="dial-btns">
        <div class="dial-btn" onclick="dial(1,-1)">&#8722;</div>
        <div class="dial-btn" onclick="dial(1,+1)">&#43;</div>
      </div>
    </div>
    <div class="dial">
      <div class="dial-label">PRINT STOP</div>
      <div class="dial-btns">
        <div class="dial-btn" onclick="dial(2,-1)">&#8722;</div>
        <div class="dial-btn" onclick="dial(2,+1)">&#43;</div>
      </div>
    </div>
  </div>
</div>

<div class="panel">
  <div class="panel-title">Buttons</div>
  <div class="btn-grid">
    <!-- ButtonName enum: Reset=0, MemSet=1, Mem1=2, Mem2=3, Mem3=4, Start=5 -->
    <button class="action-btn" onclick="btn(0)">RESET</button>
    <button class="action-btn" onclick="btn(1)">MEM SET</button>
    <button class="action-btn start" onclick="btn(5)">START</button>
    <button class="action-btn" onclick="btn(2)">MEM 1</button>
    <button class="action-btn" onclick="btn(3)">MEM 2</button>
    <button class="action-btn" onclick="btn(4)">MEM 3</button>
  </div>
</div>

<div id="status-bar">Loading WASM…</div>

<script>
  // ---- Audio (Web Audio API beep) ----
  let audioCtx = null;
  function beep() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
      osc.start(audioCtx.currentTime);
      osc.stop(audioCtx.currentTime + 0.05);
    } catch(e) {}
  }

  // ---- Output callbacks (registered before Module loads) ----
  let mod = null;

  window.FStopModuleConfig = {
    onOutput: {
      setTime(ms) {
        const s = ms / 1000;
        document.getElementById('display').textContent =
          s < 10 ? s.toFixed(1) : s.toFixed(0) + '.0';
      },
      setStepIntervalLed(n) {
        for (let i = 0; i < 4; i++)
          document.getElementById('si-' + i).classList.toggle('on', i === n);
      },
      setPrintStopLed(n) {
        for (let i = 0; i < 7; i++)
          document.getElementById('ps-' + i).classList.toggle('on', i === n);
      },
      setEnlarger(on) {
        document.getElementById('enlarger-indicator').classList.toggle('on', !!on);
      },
      click() { beep(); },
      displayStatus(code) {
        document.getElementById('display').textContent = 'E-' + code;
        document.getElementById('status-bar').textContent = 'Error ' + code;
      },
    }
  };

  // ---- Input helpers ----
  function btn(index) {
    if (mod) mod.ccall('web_button_press', null, ['number'], [index]);
  }
  function dial(d, dir) {
    if (mod) mod.ccall('web_dial_turn', null, ['number', 'number'], [d, dir]);
  }
  function selectMode(m) {
    ['mode-focus','mode-test','mode-print'].forEach((id,i) =>
      document.getElementById(id).classList.toggle('active', i === m));
    if (mod) mod.ccall('web_mode_select', null, ['number'], [m]);
  }

  // ---- Load WASM module ----
  // fstop_web.js must be in the same directory as this HTML file.
  // Build output: cd web && mkdir -p build && cd build && emcmake cmake .. && emmake make
  // Serve:        python -m http.server from the build directory (or copy index.html there)
  const script = document.createElement('script');
  script.src = './fstop_web.js';
  script.onload = () => {
    FStopModule({ onOutput: window.FStopModuleConfig.onOutput }).then(instance => {
      mod = instance;
      mod.onOutput = window.FStopModuleConfig.onOutput;
      document.getElementById('status-bar').textContent = 'Ready — select mode and press START';
      // Default to Print mode
      selectMode(2);
    });
  };
  script.onerror = () => {
    document.getElementById('status-bar').textContent =
      'Could not load fstop_web.js — serve from build directory';
  };
  document.head.appendChild(script);
</script>
</body>
</html>
